name: Release

# Baut den Installer auf einem Windows-Runner und haengt ihn an das Release.
# Ausgeloest von Tags wie v2.0.1 - oder von Hand ueber "Run workflow".

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. 2.0.1 oder v2.0.1 - laedt an das Release v<Nummer>. Leer = nur Build-Artefakt.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v7

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Versionsnummer bestimmen
        id: ver
        shell: pwsh
        run: |
          $raw = '${{ github.event.inputs.version }}'
          if (-not $raw -and '${{ github.ref_type }}' -eq 'tag') { $raw = '${{ github.ref_name }}' }
          # Fuehrendes "v" ist ueberall erlaubt - im Tag wie im Eingabefeld.
          $v = ($raw -replace '^[vV]', '').Trim()
          if ($v -and $v -notmatch '^\d+\.\d+\.\d+$') {
            throw "'$raw' ist keine Versionsnummer: erwartet wird x.y.z, wahlweise mit fuehrendem v."
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Inno Setup sicherstellen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup vorhanden: $iscc"
          } else {
            Write-Host 'Inno Setup fehlt - wird installiert.'
            choco install innosetup -y --no-progress
          }

      - name: Bauen
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          if ($v) { .\build.ps1 -Version $v } else { .\build.ps1 }

      - name: Installer als Artefakt sichern
        uses: actions/upload-artifact@v7
        with:
          name: VoicePTT-Setup
          path: dist/VoicePTT-Setup.exe
          if-no-files-found: error

      # Laeuft bei Tags automatisch; bei einem Lauf von Hand, sobald eine
      # Versionsnummer angegeben wurde (Ziel ist dann das Release v<Nummer>).
      - name: An das Release haengen
        if: github.ref_type == 'tag' || steps.ver.outputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          if ('${{ github.ref_type }}' -ne 'tag') { $tag = 'v${{ steps.ver.outputs.version }}' }
          $v = $tag -replace '^[vV]', ''
          Write-Host "Ziel-Release: $tag"

          # Beschreibung aus dem passenden CHANGELOG-Abschnitt holen. Gesucht wird die
          # Zeile "## [x.y.z]"; genommen wird alles bis zur naechsten solchen Zeile.
          $notes = "Automatisch gebaut aus $tag."
          if (Test-Path 'CHANGELOG.md') {
            $lines = Get-Content 'CHANGELOG.md' -Encoding utf8
            $muster = '^##\s+\[' + [regex]::Escape($v) + '\]'
            $start = ($lines | Select-String -Pattern $muster | Select-Object -First 1).LineNumber
            if ($start -and $start -lt $lines.Count) {
              $rest = @($lines[$start..($lines.Count - 1)])
              $weiter = ($rest | Select-String -Pattern '^##\s+\[' | Select-Object -First 1).LineNumber
              if ($weiter -and $weiter -gt 1) { $rest = @($rest[0..($weiter - 2)]) }
              $block = ($rest -join "`n").Trim()
              if ($block) {
                $notes = $block
                Write-Host "Beschreibung aus CHANGELOG.md uebernommen ($($rest.Count) Zeilen)."
              }
            } else {
              Write-Host "Kein CHANGELOG-Abschnitt fuer $v gefunden - generische Beschreibung."
            }
          }
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesFile -Value $notes -Encoding utf8

          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag existiert noch nicht - wird angelegt."
            gh release create $tag --title "Voice Push-to-Talk $v" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "Release konnte nicht angelegt werden." }
          } else {
            Write-Host "Release $tag existiert bereits - die Beschreibung bleibt unveraendert."
          }
          gh release upload $tag dist\VoicePTT-Setup.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw "Upload fehlgeschlagen." }
          Write-Host "Installer haengt an Release $tag."
