name: Release

# Baut den Installer auf einem Windows-Runner und haengt ihn an das Release.
# Ausgeloest von Tags wie v2.0.1 - oder von Hand ueber "Run workflow".

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versionsnummer, z. B. 2.0.1 (nur fuer manuelle Laeufe)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Versionsnummer bestimmen
        id: ver
        shell: pwsh
        run: |
          $v = '${{ github.event.inputs.version }}'
          if (-not $v) { $v = '${{ github.ref_name }}' -replace '^v', '' }
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "::warning::'$v' ist keine Versionsnummer x.y.z - nutze die Werte aus den Projektdateien."
            $v = ''
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $(if ($v) { $v } else { 'aus Projektdateien' })"

      - name: Inno Setup sicherstellen
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            Write-Host "Inno Setup vorhanden: $iscc"
          } else {
            Write-Host 'Inno Setup fehlt - wird installiert.'
            choco install innosetup -y --no-progress
          }

      - name: Bauen
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          if ($v) { .\build.ps1 -Version $v } else { .\build.ps1 }

      - name: Installer als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: VoicePTT-Setup
          path: dist/VoicePTT-Setup.exe
          if-no-files-found: error

      # Laeuft bei Tags automatisch; bei einem Lauf von Hand, sobald eine
      # Versionsnummer angegeben wurde (Ziel ist dann das Release v<Nummer>).
      - name: An das Release haengen
        if: github.ref_type == 'tag' || steps.ver.outputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          if ('${{ github.ref_type }}' -ne 'tag') { $tag = 'v${{ steps.ver.outputs.version }}' }
          Write-Host "Ziel-Release: $tag"
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag existiert noch nicht - wird angelegt."
            gh release create $tag --title "Voice Push-to-Talk $($tag -replace '^v', '')" --notes "Automatisch gebaut aus $tag."
            if ($LASTEXITCODE -ne 0) { throw "Release konnte nicht angelegt werden." }
          }
          gh release upload $tag dist\VoicePTT-Setup.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw "Upload fehlgeschlagen." }
          Write-Host "Installer haengt an Release $tag."
